name: Temporary Obsidian TNT v1.2.2 Builder

on:
  pull_request:
    branches: [master]
    paths:
      - 'build-v122.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build v1.2.2
        run: bash build-v122.sh
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianTNT-1.16.5-1.2.2
          path: artifact-v122/ObsidianTNT-1.16.5-1.2.2.jar
          if-no-files-found: error
