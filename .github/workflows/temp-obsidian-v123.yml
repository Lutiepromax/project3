name: Temporary Obsidian TNT v1.2.3 Builder

on:
  pull_request:
    branches: [master]
    paths:
      - 'build-v123.sh'
      - 'v122src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build v1.2.3
        run: bash build-v123.sh
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianTNT-1.16.5-1.2.3
          path: artifact-v123/ObsidianTNT-1.16.5-1.2.3.jar
          if-no-files-found: error
