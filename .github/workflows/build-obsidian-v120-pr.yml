name: Build Obsidian TNT v1.2.0

on:
  pull_request:
    branches: [master]
    paths:
      - 'obsidian-v120-trigger.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 for ForgeGradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Recreate the previously compiled v1.1.0 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/build-obsidian-tnt.yml').read_text()
          marker = '      - name: Create and build Forge 1.16.5 mod\n'
          start = workflow.index(marker)
          run_marker = '        run: |\n'
          start = workflow.index(run_marker, start) + len(run_marker)
          lines = []
          for line in workflow[start:].splitlines():
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  lines.append(line[10:])
              elif not line.strip():
                  lines.append('')
              else:
                  break
          Path('/tmp/recreate_v110.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/recreate_v110.sh

      - name: Apply v1.2.0 visibility, hitbox, knockback and durability UI changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          java = Path('forge-work/src/main/java/com/radel/obsidiantnt/ObsidianTNTMod.java')
          s = java.read_text()

          s = s.replace('import net.minecraft.entity.EntityClassification;\n',
                        'import net.minecraft.entity.Entity;\nimport net.minecraft.entity.EntityClassification;\n')
          s = s.replace('import net.minecraft.entity.item.TNTEntity;\n',
                        'import net.minecraft.entity.item.TNTEntity;\nimport net.minecraft.entity.player.ServerPlayerEntity;\nimport net.minecraft.network.IPacket;\nimport net.minecraft.network.play.server.SEntityVelocityPacket;\n')
          s = s.replace('import net.minecraft.util.math.BlockPos;\n',
                        'import net.minecraft.util.math.AxisAlignedBB;\nimport net.minecraft.util.math.BlockPos;\nimport net.minecraft.util.math.vector.Vector3d;\n')
          s = s.replace('import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;\n',
                        'import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;\nimport net.minecraftforge.fml.network.NetworkHooks;\n')
          s = s.replace('import java.util.ArrayList;\nimport java.util.List;\n',
                        'import java.util.ArrayList;\nimport java.util.IdentityHashMap;\nimport java.util.List;\nimport java.util.Map;\n')
          s = s.replace('private static final double RAY_SAMPLE_STEP = 0.05D;\n',
                        'private static final double RAY_SAMPLE_STEP = 0.05D;\n                  private static final double KNOCKBACK_MULTIPLIER = 10.0D;\n')

          owner_anchor = '''                  @Override
                  @Nullable
                  public LivingEntity getOwner() {
                      return customOwner != null ? customOwner : super.getOwner();
                  }

'''
          owner_replacement = '''                  @Override
                  @Nullable
                  public LivingEntity getOwner() {
                      return customOwner != null ? customOwner : super.getOwner();
                  }

                  @Override
                  public IPacket<?> getAddEntityPacket() {
                      return NetworkHooks.getEntitySpawningPacket(this);
                  }

                  @Override
                  public boolean isPickable() {
                      return true;
                  }

                  @Override
                  public boolean isPushable() {
                      return true;
                  }

                  @Override
                  public boolean canBeCollidedWith() {
                      return true;
                  }

'''
          if owner_anchor not in s:
              raise RuntimeError('Owner anchor not found')
          s = s.replace(owner_anchor, owner_replacement)

          explosion_old = '''                      List<BlockPos> exposedAbsorbers = findExposedAbsorbers(centerX, centerY, centerZ);

                      // The strong explosion always happens. Obsidian-like blocks remain in place
                      // while vanilla calculates blast rays, so they absorb only the rays behind them.
                      this.level.explode(this, centerX, centerY, centerZ, STRONG_POWER, Explosion.Mode.BREAK);

                      // Each exposed absorber receives exactly one durability hit per super TNT.
'''
          explosion_new = '''                      List<BlockPos> exposedAbsorbers = findExposedAbsorbers(centerX, centerY, centerZ);

                      Map<Entity, Vector3d> movementBeforeExplosion = captureEntityMovement(
                              centerX, centerY, centerZ, STRONG_POWER * 2.0D
                      );

                      // The strong explosion always happens. Obsidian-like blocks remain in place
                      // while vanilla calculates blast rays, so they absorb only the rays behind them.
                      this.level.explode(this, centerX, centerY, centerZ, STRONG_POWER, Explosion.Mode.BREAK);

                      // Vanilla blast velocity is multiplied by ten while existing movement is kept.
                      applyTenfoldKnockback(movementBeforeExplosion);

                      // Each exposed absorber receives exactly one durability hit per super TNT.
'''
          if explosion_old not in s:
              raise RuntimeError('Explosion anchor not found')
          s = s.replace(explosion_old, explosion_new)

          helper_anchor = '''                  private List<BlockPos> findExposedAbsorbers(double centerX, double centerY, double centerZ) {
'''
          helpers = '''                  private Map<Entity, Vector3d> captureEntityMovement(double centerX, double centerY,
                                                                           double centerZ, double radius) {
                      AxisAlignedBB area = new AxisAlignedBB(
                              centerX - radius, centerY - radius, centerZ - radius,
                              centerX + radius, centerY + radius, centerZ + radius
                      );

                      List<Entity> affected = this.level.getEntities(
                              this,
                              area,
                              entity -> entity.isAlive() && !entity.ignoreExplosion()
                      );

                      Map<Entity, Vector3d> result = new IdentityHashMap<>();
                      for (Entity entity : affected) {
                          result.put(entity, entity.getDeltaMovement());
                      }
                      return result;
                  }

                  private void applyTenfoldKnockback(Map<Entity, Vector3d> movementBeforeExplosion) {
                      for (Map.Entry<Entity, Vector3d> entry : movementBeforeExplosion.entrySet()) {
                          Entity entity = entry.getKey();
                          if (!entity.isAlive()) {
                              continue;
                          }

                          Vector3d before = entry.getValue();
                          Vector3d after = entity.getDeltaMovement();
                          Vector3d blastVelocity = after.subtract(before);
                          if (blastVelocity.lengthSqr() < 1.0E-8D) {
                              continue;
                          }

                          Vector3d boosted = before.add(blastVelocity.scale(KNOCKBACK_MULTIPLIER));
                          entity.setDeltaMovement(boosted);
                          entity.hurtMarked = true;

                          if (entity instanceof ServerPlayerEntity) {
                              ((ServerPlayerEntity) entity).connection.send(new SEntityVelocityPacket(entity));
                          }
                      }
                  }

''' + helper_anchor
          if helper_anchor not in s:
              raise RuntimeError('Helper anchor not found')
          s = s.replace(helper_anchor, helpers)
          java.write_text(s)

          properties = Path('forge-work/gradle.properties')
          p = properties.read_text().replace('mod_version=1.1.0', 'mod_version=1.2.0')
          p = p.replace('Tenfold TNT with directional blast absorption and staged obsidian durability.',
                        'Visible collidable tenfold TNT with tenfold knockback and polished staged durability indicators.')
          properties.write_text(p)

          textures = Path('forge-work/src/main/resources/assets/obsidiantnt/textures/block')
          textures.mkdir(parents=True, exist_ok=True)
          data = {
            1: '',
            2: '',
            3: ''
          }
          for number, encoded in data.items():
              (textures / f'durability_{number}.png').write_bytes(base64.b64decode(encoded))
          PY

          cd forge-work
          ./gradlew clean build --no-daemon --stacktrace
          cd ..
          mkdir -p artifact-v120
          JAR="$(find forge-work/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" artifact-v120/ObsidianTNT-1.16.5-1.2.0.jar

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianTNT-1.16.5-1.2.0
          path: artifact-v120/ObsidianTNT-1.16.5-1.2.0.jar
          if-no-files-found: error
